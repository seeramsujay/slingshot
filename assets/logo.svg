<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1914"/>
      <stop offset="100%" stop-color="#112d22"/>
    </linearGradient>
    <linearGradient id="slingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f260"/>
      <stop offset="50%" stop-color="#0575e6"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <linearGradient id="dustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#00f260" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Atmospheric Dispersion Grid / Particle Radar -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="115" fill="none" stroke="#00f260" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Slingshot Y-Fork Frame -->
  <path d="M 180 150 L 230 250 L 230 380 Q 250 395 270 380 L 270 250 L 320 150" fill="none" stroke="url(#slingGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Elastic Tension Trajectory Bands -->
  <path d="M 180 150 Q 250 200 250 230" fill="none" stroke="#00f5d4" stroke-width="4" stroke-dasharray="6 6"/>
  <path d="M 320 150 Q 250 200 250 230" fill="none" stroke="#00f5d4" stroke-width="4" stroke-dasharray="6 6"/>

  <!-- High-Velocity Aerosol Mitigation Projectile (Core) -->
  <circle cx="250" cy="210" r="22" fill="#173e2e" stroke="url(#dustGrad)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="250" cy="210" r="8" fill="#ffd166"/>

  <!-- Particulate Matter Sensor Nodes (PM2.5 & PM10 clusters) -->
  <circle cx="150" cy="190" r="6" fill="#ffd166" opacity="0.8"/>
  <circle cx="130" cy="230" r="4" fill="#ff6b6b" opacity="0.7"/>
  <circle cx="350" cy="190" r="6" fill="#ffd166" opacity="0.8"/>
  <circle cx="370" cy="230" r="4" fill="#ff6b6b" opacity="0.7"/>

  <!-- Kinetic Upward Trajectory Cone -->
  <path d="M 235 180 L 250 110 L 265 180 Z" fill="url(#slingGrad)" opacity="0.6"/>
</svg>
